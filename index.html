  function parseTarget(exd) {
    if (exd.targetOverride) return exd.targetOverride;
    var str = exd.setsReps || '';
    var rounds = str.match(/^(\d+)\s*rounds?$/i);
    if (rounds) return { sets: parseInt(rounds[1], 10), reps: null };
    var m = str.match(/(\d+)\s*(?:sets)?\s*x\s*(\d+)(?:-(\d+))?/i);
    if (m) { var sets = parseInt(m[1], 10); var reps = m[3] ? parseInt(m[3], 10) : parseInt(m[2], 10); return { sets: sets, reps: reps }; }
    return { sets: 3, reps: null };
  }

  function parseRestSeconds(str) {
    if (!str) return 90;
    var m = str.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*min/i);
    if (m) return Math.round(parseFloat(m[2]) * 60);
    m = str.match(/(\d+(?:\.\d+)?)\s*min/i);
    if (m) return Math.round(parseFloat(m[1]) * 60);
    m = str.match(/(\d+)\s*sec/i);
    if (m) return parseInt(m[1], 10);
    return 90;
  }

  function todayISO() { return new Date().toISOString().slice(0, 10); }

  // ---------------------------------------------------------------------
  // State + persistence
  // ---------------------------------------------------------------------
  // v1 keyed sessions flatly by date ({date: {dayId, ex}}), which meant two
  // different program days logged on the same calendar date would stomp on
  // each other's history. v2 nests by dayId first ({dayId: {date: {ex}}}) so
  // that can't happen. This migrates any existing v1 data over once.
  function migrateLegacySessions() {
    var raw;
    try { raw = localStorage.getItem(LEGACY_STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return {};
    var old;
    try { old = JSON.parse(raw); } catch (e) { return {}; }
    var migrated = {};
    Object.keys(old || {}).forEach(function (date) {
      var entry = old[date];
      if (!entry || !entry.dayId) return;
      if (!migrated[entry.dayId]) migrated[entry.dayId] = {};
      migrated[entry.dayId][date] = { ex: entry.ex || {} };
    });
    return migrated;
  }
  function loadSessions() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return migrateLegacySessions();
  }
  function saveSessions() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.sessions)); } catch (e) {}
  }

  var state = {
    view: 'home',
    activeDayId: null,
    activeDate: todayISO(),
    sessions: loadSessions(),
    restTimers: {},
    showProtocol: false,
    altOpen: {},
  };

  function ensureExercise(date, dayId, exId) {
    if (!state.sessions[dayId]) state.sessions[dayId] = {};
    if (!state.sessions[dayId][date]) state.sessions[dayId][date] = { ex: {} };
    if (!state.sessions[dayId][date].ex[exId]) state.sessions[dayId][date].ex[exId] = { rows: [], note: '' };
    return state.sessions[dayId][date].ex[exId];
  }
  function ensureRow(entry, rowIdx) {
    while (entry.rows.length <= rowIdx) entry.rows.push({ w: '', r: '', done: false });
    return entry.rows[rowIdx];
  }

  function setRowValue(date, dayId, exId, rowIdx, field, value) {
    var entry = ensureExercise(date, dayId, exId);
    ensureRow(entry, rowIdx)[field] = value;
    saveSessions();
    render();
  }
  function toggleDone(date, dayId, exId, rowIdx) {
    var entry = ensureExercise(date, dayId, exId);
    var row = ensureRow(entry, rowIdx);
    row.done = !row.done;
    saveSessions();
    render();
  }
  function addExtraSet(date, dayId, exId) {
    ensureExercise(date, dayId, exId).rows.push({ w: '', r: '', done: false });
    saveSessions();
    render();
  }
  function removeRow(date, dayId, exId, rowIdx) {
    ensureExercise(date, dayId, exId).rows.splice(rowIdx, 1);
    saveSessions();
    render();
  }
  function updateNote(date, dayId, exId, value) {
    ensureExercise(date, dayId, exId).note = value;
    saveSessions();
    render();
  }

  function getPrevRow(dayId, exId, rowIdx, beforeDate) {
    var dayObj = state.sessions[dayId] || {};
    var dates = Object.keys(dayObj).filter(function (d) {
      return d < beforeDate && dayObj[d].ex && dayObj[d].ex[exId] && dayObj[d].ex[exId].rows[rowIdx];
    }).sort();
    if (!dates.length) return null;
    return dayObj[dates[dates.length - 1]].ex[exId].rows[rowIdx];
  }

  function isSessionMet(rows, target) {
    if (!rows) return false;
    var logged = rows.filter(function (r) { return r.r !== '' && r.r !== undefined && r.r !== null; });
    if (logged.length < target.sets) return false;
    if (target.reps == null) return true;
    return logged.slice(0, target.sets).every(function (r) { return Number(r.r) >= target.reps; });
  }

  // "Ready to progress" reflects the date currently being viewed — only
  // sessions up through that date count, so browsing history doesn't show
  // today's progression status on an old session.
  function readyToProgress(dayId, exId, target, asOfDate) {
    var dayObj = state.sessions[dayId] || {};
    var dates = Object.keys(dayObj).filter(function (d) {
      return d <= asOfDate && dayObj[d].ex && dayObj[d].ex[exId] && dayObj[d].ex[exId].rows && dayObj[d].ex[exId].rows.length;
    }).sort();
    if (dates.length < 2) return false;
    var lastTwo = dates.slice(-2);
    return lastTwo.every(function (d) { return isSessionMet(dayObj[d].ex[exId].rows, target); });
  }

  function getDateList(dayId) {
    var dayObj = state.sessions[dayId] || {};
    var set = {};
    Object.keys(dayObj).forEach(function (d) { set[d] = true; });
    set[todayISO()] = true;
    return Object.keys(set).sort();
  }

  function formatDateLabel(iso) {
    var today = todayISO();
    var d = new Date(iso + 'T00:00:00');
    var label = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return iso === today ? 'Today · ' + label : label;
  }

  function openDay(id) { state.view = 'day'; state.activeDayId = id; state.activeDate = todayISO(); render(); }
  function goHome() { state.view = 'home'; render(); }
  function toggleProtocol() { state.showProtocol = !state.showProtocol; render(); }
  function moveDate(dayId, delta) {
    var list = getDateList(dayId);
    var idx = list.indexOf(state.activeDate);
    var next = Math.min(Math.max(idx + delta, 0), list.length - 1);
    state.activeDate = list[next];
    render();
  }
  function startRest(exId, seconds) {
    state.restTimers[exId] = Date.now() + seconds * 1000;
    render();
  }
  function toggleAlt(exId) {
    state.altOpen[exId] = !state.altOpen[exId];
    render();
  }

  function exportData(statusEl) {
    var payload = JSON.stringify({ exportedAt: new Date().toISOString(), sessions: state.sessions }, null, 2);
    if (window.claude && window.claude.downloads) {
      statusEl.textContent = 'Preparing export…';
      window.claude.downloads.save({ filename: 'gym-tracker-log.json', data: payload }).then(function () {
        statusEl.textContent = 'Saved.';
      }).catch(function (err) {
        if (err && err.code === 'declined') statusEl.textContent = 'Export declined.';
        else statusEl.textContent = 'Could not export right now.';
      });
      return;
    }
    // Plain browser download — used on normal hosting where the Artifact
    // capability above isn't present.
    try {
      var blob = new Blob([payload], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'gym-tracker-log.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Saved.';
    } catch (e) {
      statusEl.textContent = 'Could not export right now.';
    }
  }

    nav.appendChild(h('button', {

    var session = state.sessions[day.id] && state.sessions[day.id][date];
    var lastSection = null;
    day.exercises.forEach(function (exd, i) {
      var exId = day.id + '-' + i;
      var target = parseTarget(exd);
      var existing = session && session.ex && session.ex[exId];
      var rowsCount = Math.max(target.sets, existing ? existing.rows.length : target.sets);

      if (exd.section && exd.section !== lastSection) {
        wrap.appendChild(h('div', { class: 'section-header' }, exd.section));
      }
      lastSection = exd.section || lastSection;

      var card = h('div', { class: 'card ex-card' });
      var tags = h('div', { class: 'ex-tags' }, [ h('span', { class: 'tag tag-outline' }, String(i + 1)) ]);

      card.appendChild(h('div', { class: 'card-title' }, exd.name));

      var ruleEl = h('div', { class: 'ex-rule' });

          h('span', {}, 'Two clean sessions at target — ready to progress.'),

      }

      var rowsWrap = h('div', { class: 'rows' });
      for (var r = 0; r < rowsCount; r++) {
        (function (r) {
          var rw = (existing && existing.rows[r]) || { w: '', r: '', done: false };
          var prev = getPrevRow(day.id, exId, r, date);
          var isExtra = r >= target.sets;
          var rowEl = h('div', { class: 'row' });

          rowEl.appendChild(h('input', {
            class: 'input', type: 'text', inputmode: 'decimal',
            placeholder: (prev && prev.w) ? prev.w : exd.weight,
            value: rw.w,
            onChange: function (e) { setRowValue(date, day.id, exId, r, 'w', e.target.value); },
          }));
          rowEl.appendChild(h('input', {
            class: 'input', type: 'text', inputmode: 'numeric',
            placeholder: (prev && prev.r) ? String(prev.r) : '',
            value: rw.r,
            onChange: function (e) { setRowValue(date, day.id, exId, r, 'r', e.target.value); },
          }));
          rowEl.appendChild(h('input', {
            type: 'checkbox', checked: rw.done, 'aria-label': 'Set done',
            onChange: function () { toggleDone(date, day.id, exId, r); },
          }));
          if (isExtra) {
            rowEl.appendChild(h('button', {
              class: 'btn btn-icon', style: { width: '26px', height: '26px' }, 'aria-label': 'Remove set',
              html: icon('x', 12), onClick: function () { removeRow(date, day.id, exId, r); },
            }));
          } else {
            rowEl.appendChild(h('span', {}));
          }
          rowsWrap.appendChild(rowEl);
        })(r);
      }
      card.appendChild(rowsWrap);

      var actions = h('div', { class: 'ex-actions' });
      actions.appendChild(h('button', {
        class: 'btn btn-ghost', html: icon('plus', 12) + ' Add set',
        onClick: function () { addExtraSet(date, day.id, exId); },
      }));

      var restSecs = parseRestSeconds(exd.rest);
      var endAt = state.restTimers[exId];
      var remaining = endAt ? Math.max(0, Math.round((endAt - Date.now()) / 1000)) : 0;
      var restBtnHolder = h('span', { 'data-rest-holder': exId });
      restBtnHolder.appendChild(renderRestButton(exId, exd.rest, restSecs, remaining));
      actions.appendChild(restBtnHolder);

      var altList = ALTERNATIVES[exId];
      if (altList && altList.length) {
        var altOpen = !!state.altOpen[exId];
        actions.appendChild(h('button', {
          class: 'btn btn-ghost', html: icon('swap', 12) + (altOpen ? ' Hide alternatives' : ' Machine taken / hurts? Swap it'),
          onClick: function () { toggleAlt(exId); },
        }));
      }
      card.appendChild(actions);

      if (altList && altList.length && state.altOpen[exId]) {
        var altWrap = h('div', { class: 'alt-list' });
        altList.forEach(function (alt) {
          var altItem = h('div', { class: 'alt-item' });
          altItem.appendChild(h('div', { class: 'alt-name' }, alt.name));
          altItem.appendChild(h('div', { class: 'alt-reason' }, alt.reason));
          altWrap.appendChild(altItem);
        });
        card.appendChild(altWrap);
      }

      var noteVal = (existing && existing.note) || '';
      var textarea = h('textarea', {
        class: 'note-field', placeholder: 'Notes for this exercise…', value: noteVal,
        onChange: function (e) { updateNote(date, day.id, exId, e.target.value); },
      });
      card.appendChild(textarea);

      wrap.appendChild(card);
    });

    return wrap;
  }

  function renderRestButton(exId, restLabel, restSecs, remaining) {
    if (remaining > 0) {
      var mm = Math.floor(remaining / 60), ss = String(remaining % 60).padStart(2, '0');
      return h('button', {
        class: 'btn btn-secondary', disabled: true, 'data-rest-btn': exId,
        html: icon('clock', 12) + ' <span data-rest-text>' + mm + ':' + ss + '</span>',
      });
    }
    return h('button', {
      class: 'btn btn-ghost', 'data-rest-btn': exId,
      html: icon('clock', 12) + ' Rest ' + restLabel,
      onClick: function () { startRest(exId, restSecs); },
    });
  }

  function render() {
    root.replaceChildren(state.view === 'home' ? renderHome() : renderDay());
  }

  // tick running rest timers once a second; update in place, only trigger a
  // full re-render when a timer actually finishes (its markup changes).
  setInterval(function () {
    if (state.view !== 'day') return;
    var needsRender = false;
    var day = PROGRAM.filter(function (d) { return d.id === state.activeDayId; })[0];
    if (!day) return;
    day.exercises.forEach(function (exd, i) {
      var exId = day.id + '-' + i;
      var endAt = state.restTimers[exId];
      if (!endAt) return;
      var remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (remaining <= 0) {
        delete state.restTimers[exId];
        needsRender = true;
        return;
      }
      var btn = root.querySelector('[data-rest-btn="' + exId + '"] [data-rest-text]');
      if (btn) {
        var mm = Math.floor(remaining / 60), ss = String(remaining % 60).padStart(2, '0');
        btn.textContent = mm + ':' + ss;
      } else {
        needsRender = true;
      }
    });
    if (needsRender) render();
  }, 1000);

  render();
})();
</script>
